[package]
name = "raydium-pump-snipe-bot"
version = "0.2.0"
edition = "2021"
description = "Solana new-token sniper and cross-DEX arbitrage bot"

[dependencies]
anyhow = "1"
base64 = "0.22"
bincode = "1.3"
borsh = { version = "1.5", features = ["derive"] }
bs58 = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dashmap = "6"
dotenvy = "0.15"
futures-util = "0.3"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-sdk = "2.2"
solana-program = "2.2"
solana-client = "2.2"
solana-transaction-status = "2.2"
spl-associated-token-account = "6"
spl-token = "7"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
